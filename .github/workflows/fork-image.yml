# Fork-only image build. Not for upstreaming: this file lives on `fork/**`
# branches and must never appear in a PR against msgbyte/tianji.
#
# Upstream's docker-publish.yml fires on `v*` tags, needs Docker Hub
# credentials and publishes `moonrailgun/tianji`. This builds the same
# Dockerfile on a hosted runner and publishes to GHCR instead.
#
# amd64 only: every node in spot-lon-infinity is amd64.
name: Fork image

on:
  push:
    branches:
      - "fork/**"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tianji
  # Upstream version this branch is patched on top of. Bump when the branch is
  # rebased onto a newer tag; it's what the published tag is derived from.
  UPSTREAM_VERSION: "1.33.9"
  # build-push-action otherwise uploads a .dockerbuild artifact per run.
  DOCKER_BUILD_SUMMARY: "false"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The client build alone wants a 4 GB heap, and the hosted image ships
      # ~25 GB of toolchains this build never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        run: |
          echo "tag=${UPSTREAM_VERSION}-fork.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          # Two immutable tags: the sha identifies the source, the fork.N tag
          # is what a human reads in the deployment. No moving `latest`.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${IMAGE_NAME}:${{ steps.vars.outputs.tag }}"
            echo "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Built from \`${GITHUB_REF_NAME}\` @ \`$(git rev-parse --short HEAD)\`,"
            echo "patched on top of upstream v${UPSTREAM_VERSION}."
          } >> "$GITHUB_STEP_SUMMARY"
